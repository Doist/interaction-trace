name: Publish retained interaction-trace artifact

on:
    workflow_dispatch:
        inputs:
            source_run_id:
                description: Successful pack.yml run containing the reviewed tarball
                required: true
                type: string
            source_run_attempt:
                description: Original successful pack attempt recorded in release.json
                required: true
                default: "1"
                type: string
            version:
                description: Exact stable version in the retained artifact (intended migration release 1.1.4)
                required: true
                type: string
            destination:
                description: Use github after manual npm bootstrap; both for future OIDC releases
                required: true
                default: both
                type: choice
                options: [both, npm, github]
            dist_tag:
                description: Use recovery for an older missing version without moving latest
                required: true
                default: latest
                type: choice
                options: [latest, recovery]

permissions:
    contents: read

concurrency:
    group: interaction-trace-publication
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'todoist/interaction-trace' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: package-release
        permissions:
            contents: read
            actions: read
            id-token: write
            packages: write
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
            - run: npm install --global npm@11.21.2 --ignore-scripts
            - name: Validate source run, exact tag commit and reviewed ancestry
              id: source
              run: node .github/scripts/release-source.mjs run
              env:
                  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
                  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/download-artifact@v4
              with:
                  name: interaction-trace-${{ inputs.version }}
                  path: ${{ runner.temp }}/interaction-trace-release
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ inputs.source_run_id }}
            - name: Verify artifact before publication
              env:
                  RELEASE_DIR: ${{ runner.temp }}/interaction-trace-release
                  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
                  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  SOURCE_REF: ${{ steps.source.outputs.ref }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: node .github/scripts/release.mjs verify "$RELEASE_DIR" "$SOURCE_SHA" "$RELEASE_VERSION" "$SOURCE_REF"
            - name: Publish or verify npm copy through OIDC
              if: inputs.destination == 'both' || inputs.destination == 'npm'
              env:
                  RELEASE_DIR: ${{ runner.temp }}/interaction-trace-release
                  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
                  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  RELEASE_TAG: ${{ inputs.dist_tag }}
                  # Read the internal mirror in cross-registry preflight; never sent to npmjs.
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/release.mjs publish "$RELEASE_DIR" "$SOURCE_SHA" "$RELEASE_VERSION" npm "$RELEASE_TAG"
            - name: Publish or verify GitHub copy (preserve internal visibility)
              if: inputs.destination == 'both' || inputs.destination == 'github'
              env:
                  RELEASE_DIR: ${{ runner.temp }}/interaction-trace-release
                  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
                  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ inputs.dist_tag }}
              run: node .github/scripts/release.mjs publish "$RELEASE_DIR" "$SOURCE_SHA" "$RELEASE_VERSION" github "$RELEASE_TAG"
