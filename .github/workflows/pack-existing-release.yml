name: Pack an existing reviewed release (no publication)

on:
    workflow_dispatch:
        inputs:
            version:
                description: Existing stable release whose original pack produced no artifact
                required: true
                type: string

permissions:
    contents: read

jobs:
    pack:
        if: github.repository == 'todoist/interaction-trace' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
              with:
                  path: workflow
                  persist-credentials: false
            - name: Resolve the existing normal release commit
              id: source
              working-directory: workflow
              run: node .github/scripts/release-source.mjs resolve-existing
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/checkout@v5
              with:
                  ref: ${{ steps.source.outputs.sha }}
                  path: source
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version-file: source/.node-version
                  cache: npm
                  cache-dependency-path: source/package-lock.json
            - name: Verify the checkout matches the reviewed release
              working-directory: source
              env:
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  SOURCE_REF: ${{ steps.source.outputs.ref }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  node "$GITHUB_WORKSPACE/workflow/.github/scripts/release-source.mjs" pack
                  node -e 'if (require("./package.json").version !== process.env.RELEASE_VERSION) process.exit(1)'
            - name: Install isolated npm CLI
              run: |
                  npm install --prefix "$RUNNER_TEMP/npm-cli" --ignore-scripts --no-audit --no-fund npm@11.21.2
                  echo "$RUNNER_TEMP/npm-cli/node_modules/.bin" >> "$GITHUB_PATH"
            - working-directory: source
              run: npm ci --ignore-scripts --no-audit --no-fund
            - working-directory: source
              run: npm run check
            - working-directory: source
              run: npm test
            - working-directory: source
              run: npm run build
            - working-directory: workflow
              run: node --test .github/scripts/*.test.mjs
            - name: Pack the checked release once
              working-directory: source
              env:
                  RELEASE_DIR: ${{ runner.temp }}/interaction-trace-release
                  RELEASE_SHA: ${{ steps.source.outputs.sha }}
                  RELEASE_REF: ${{ steps.source.outputs.ref }}
                  SOURCE_WORKFLOW_PATH: .github/workflows/pack-existing-release.yml
              run: node "$GITHUB_WORKSPACE/workflow/.github/scripts/release.mjs" pack "$RELEASE_DIR" "$RELEASE_SHA" "$RELEASE_REF"
            - uses: actions/upload-artifact@v4
              with:
                  name: interaction-trace-${{ inputs.version }}
                  path: ${{ runner.temp }}/interaction-trace-release/
                  if-no-files-found: error
                  retention-days: 90
